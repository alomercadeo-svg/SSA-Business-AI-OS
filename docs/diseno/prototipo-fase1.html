<html lang="es">
<head>
<meta charset="utf-8">

<!-- Referencia visual aprobada por la clienta el 06/10/2026. El plano (docs/requerimientos-fase1.md) manda si chocan. -->

<title>Prototipo ALO Mercadeo</title>
<style>
/* Layout: el mismo esqueleto del fork (barra lateral + contenido), bandeja en tres zonas; en teléfono, lista o hilo y la barra en un menú. */
:root {
  --bg: #ffffff;
  --bg-sub: #f7f7f9;
  --bg-hover: #f1f1f4;
  --fg: #18181d;
  --muted: #696975;
  --faint: #9a9aa6;
  --line: #e7e7ec;
  --accent: #7646e0;        /* violeta de la marca (#a56fff) oscurecido para que el texto blanco sea legible */
  --accent-strong: #5f33c4;
  --accent-soft: #f1ebff;
  --accent-fg: #ffffff;
  --ok: #157a3c;   --ok-soft: #e6f5ec;
  --warn: #9a5a06; --warn-soft: #fdf2df;
  --danger: #bf2a30; --danger-soft: #fde9ea;
  --ig: #c72c79;  --wa: #1d8f4e;
  --bubble-in: #f2f2f5;
  --bubble-out: #ece4ff;
  --shadow: 0 8px 30px rgba(20, 16, 40, 0.12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141418; --bg-sub: #1a1a20; --bg-hover: #23232b; --fg: #ececf1; --muted: #a3a3b0; --faint: #74747f;
    --line: #2b2b34; --accent: #9b74f5; --accent-strong: #b394ff; --accent-soft: #2a2140; --accent-fg: #ffffff;
    --ok: #5fd08e; --ok-soft: #173426; --warn: #f0b45a; --warn-soft: #3a2a12; --danger: #f2777c; --danger-soft: #3c1a1d;
    --ig: #f06aa8; --wa: #4cc985; --bubble-in: #23232b; --bubble-out: #2f2550; --shadow: 0 8px 30px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141418; --bg-sub: #1a1a20; --bg-hover: #23232b; --fg: #ececf1; --muted: #a3a3b0; --faint: #74747f;
  --line: #2b2b34; --accent: #9b74f5; --accent-strong: #b394ff; --accent-soft: #2a2140; --accent-fg: #ffffff;
  --ok: #5fd08e; --ok-soft: #173426; --warn: #f0b45a; --warn-soft: #3a2a12; --danger: #f2777c; --danger-soft: #3c1a1d;
  --ig: #f06aa8; --wa: #4cc985; --bubble-in: #23232b; --bubble-out: #2f2550; --shadow: 0 8px 30px rgba(0,0,0,0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }

/* App shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.side { background: var(--bg-sub); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.ws { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
.ws-logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: 0.02em; }
.ws-name { font-weight: 650; }
.ws-sub { font-size: 12px; color: var(--muted); }
.nav { padding: 10px; display: grid; gap: 2px; overflow-y: auto; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--faint); padding: 12px 10px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; color: var(--fg); }
.nav button:hover { background: var(--bg-hover); }
.nav button.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav button.later { color: var(--faint); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .pill { margin-left: auto; }
.side-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: none; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 20px; font-size: 13.5px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.banner.danger { background: var(--danger-soft); color: var(--danger); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--accent-strong); }
.banner button { margin-left: auto; }
.screen { flex: 1; min-height: 0; overflow-y: auto; }
.page { padding: 28px 28px 80px; max-width: 1180px; display: grid; gap: 20px; }
.page-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; }
.page-head p { color: var(--muted); margin-top: 4px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); padding: 7px 12px; border-radius: 8px; font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; border-radius: 8px; min-width: 0; }
textarea.input { resize: vertical; }
.field { display: grid; gap: 5px; }
.field label, .lbl { font-size: 12px; color: var(--muted); font-weight: 550; }
.help { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--bg-hover); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.accent { background: var(--accent-soft); color: var(--accent-strong); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.tag { display: inline-flex; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: var(--accent-soft); color: var(--accent-strong); white-space: nowrap; }
.chip { border: 1px solid var(--line); background: var(--bg); padding: 4px 10px; border-radius: 999px; font-size: 12.5px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.card-body { padding: 18px; display: grid; gap: 12px; }
.card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-head h3 { font-size: 15px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ch-ico { width: 16px; height: 16px; flex: none; }
.ig { color: var(--ig); } .wa { color: var(--wa); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-hover); display: grid; place-items: center; font-weight: 650; color: var(--muted); flex: none; position: relative; }
.avatar .ch-ico { position: absolute; right: -3px; bottom: -3px; width: 15px; height: 15px; background: var(--bg); border-radius: 50%; padding: 1px; }
.avatar.lg { width: 64px; height: 64px; font-size: 22px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 10px 14px; background: var(--bg-sub); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click:hover { background: var(--bg-hover); cursor: pointer; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 48px 24px; display: grid; justify-items: center; gap: 10px; text-align: center; }
.empty h3 { font-size: 17px; }
.empty p { color: var(--muted); max-width: 46ch; }
.skel { background: linear-gradient(90deg, var(--bg-hover), var(--bg-sub), var(--bg-hover)); background-size: 200% 100%; border-radius: 8px; animation: sh 1.4s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 550; white-space: nowrap; }
.tabs button.on { color: var(--accent-strong); border-bottom-color: var(--accent); }
.switch { width: 38px; height: 22px; border-radius: 999px; background: var(--line); border: 0; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { left: 19px; }
.switch[disabled] { opacity: .6; cursor: not-allowed; }

/* Inbox */
.inbox { display: grid; grid-template-columns: 340px minmax(0, 1fr) 300px; height: 100%; min-height: 0; }
.inbox.no-panel { grid-template-columns: 340px minmax(0, 1fr); }
.ilist { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.ilist-head { padding: 14px 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.ilist-title { display: flex; align-items: baseline; gap: 8px; }
.ilist-title h1 { font-size: 18px; }
.status-tabs { display: flex; gap: 4px; }
.status-tabs button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; color: var(--muted); font-weight: 550; }
.status-tabs button.on { background: var(--accent); color: var(--accent-fg); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; }
.fbtn.on { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); font-weight: 600; }
.fpanel { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--bg-sub); }
.fpanel .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.conv-list { overflow-y: auto; flex: 1; min-height: 0; }
.conv { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; background: transparent; width: 100%; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.conv:hover { background: var(--bg-hover); }
.conv.sel { background: var(--accent-soft); }
.conv-main { min-width: 0; flex: 1; display: grid; gap: 2px; }
.conv-top { display: flex; gap: 6px; align-items: baseline; }
.conv-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-time { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.conv-prev { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
.unread { background: var(--accent); color: var(--accent-fg); border-radius: 999px; font-size: 11px; font-weight: 700; min-width: 19px; height: 19px; display: grid; place-items: center; padding: 0 5px; }
.list-foot { padding: 10px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.thread { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.thread-head { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.thread-head h2 { font-size: 16px; }
.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.day { align-self: center; font-size: 12px; color: var(--muted); padding: 2px 10px; }
.bub { max-width: min(70%, 520px); padding: 9px 12px; border-radius: 14px; background: var(--bubble-in); overflow-wrap: anywhere; }
.bub.out { align-self: flex-end; background: var(--bubble-out); border-bottom-right-radius: 4px; }
.bub.in { border-bottom-left-radius: 4px; }
.bub-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.att { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.att .box { width: 34px; height: 34px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; border: 1px solid var(--line); }
.sys-note { align-self: center; font-size: 12.5px; color: var(--muted); background: var(--bg-sub); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
.composer { border-top: 1px solid var(--line); padding: 12px 18px; display: grid; gap: 8px; position: relative; }
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 42px; max-height: 140px; }
.block { border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13.5px; }
.block.danger { background: var(--danger-soft); color: var(--danger); }
.block.warn { background: var(--warn-soft); color: var(--warn); }
.block.info { background: var(--bg-sub); border: 1px solid var(--line); color: var(--fg); }
.qr-picker { position: absolute; bottom: calc(100% - 4px); left: 18px; right: 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; max-height: 260px; overflow-y: auto; z-index: 5; }
.qr-item { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px; display: grid; gap: 2px; }
.qr-item:hover, .qr-item.on { background: var(--accent-soft); }
.qr-item b { font-family: var(--mono); font-size: 12.5px; color: var(--accent-strong); }
.qr-item span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cpanel { border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
.cpanel-sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.cpanel-sec h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.fu-opts { display: flex; gap: 5px; flex-wrap: wrap; }
.note { background: var(--bg-sub); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: grid; gap: 3px; }
.note small { color: var(--muted); }
.back-btn { display: none; }

/* Contact page */
.ficha { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
.timeline { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.tl-item:last-child { border-bottom: 0; }

/* Import */
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--bg-sub); color: var(--muted); font-size: 13px; }
.step b { width: 22px; height: 22px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 12px; color: var(--fg); }
.step.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.step.on b { background: var(--accent); color: var(--accent-fg); }
.step.done b { background: var(--ok); color: #fff; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 40px 20px; display: grid; justify-items: center; gap: 8px; text-align: center; }
.bar { height: 10px; background: var(--bg-hover); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font-size: 24px; font-variant-numeric: tabular-nums; }

/* Channel cards */
.chcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.chcard { border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; align-content: start; }
.chcard-top { display: flex; gap: 12px; align-items: center; }
.chcard-top .icowrap { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--bg-sub); }
.chcard-top .icowrap svg { width: 22px; height: 22px; }
.qr { width: 180px; height: 180px; display: grid; grid-template-columns: repeat(21, 1fr); background: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--line); }
.qr i { background: #111; }
.qr i.w { background: #fff; }

/* Rules page */
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.rule h4 { font-size: 14.5px; }
.rule .ctl { grid-row: span 2; display: flex; align-items: center; gap: 8px; }
.rule .num { width: 70px; }

/* Overlays */
.overlay { position: fixed; inset: 0; background: rgba(15, 12, 30, 0.42); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--bg); border-radius: 16px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; }
.modal.wide { width: min(820px, 100%); }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal-head h3 { font-size: 16px; }
.modal-body { padding: 18px 20px; display: grid; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.merge { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.merge .side-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; font-size: 13px; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; justify-items: end; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13.5px; max-width: 360px; display: flex; gap: 8px; align-items: center; }
.toast.err { background: var(--danger); color: #fff; }
.demo { position: fixed; left: 16px; bottom: 64px; z-index: 40; }
.demo-btn { background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; box-shadow: var(--shadow); font-size: 13px; }
.demo-panel { position: absolute; bottom: calc(100% + 8px); left: 0; width: 300px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }
.demo-panel .opts { display: flex; gap: 5px; flex-wrap: wrap; }
.demo-panel h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px; }
.scrim { display: none; }

/* Responsive */
@media (max-width: 1200px) {
  .inbox { grid-template-columns: 320px minmax(0, 1fr); }
  .cpanel { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 92vw); background: var(--bg); z-index: 45; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); }
  .cpanel[hidden] { display: none !important; }
}
@media (min-width: 1201px) { .panel-toggle { display: none; } }
@media (max-width: 860px) {

function visibleConvs() {
  const f = S.f;
  return V.filter(v => {
    const c = contact(v.c);
    if (S.role === 'member' && !(c.setter === 'laura' || c.vend === 'laura')) return false;
    if (f.status === 'abiertas' && v.status !== 'abierta') return false;
    if (f.status === 'cerradas' && v.status !== 'cerrada') return false;
    if (f.canal.length && !f.canal.includes(v.ch)) return false;
    if (f.unres && c.resolved) return false;
    if (f.asig === 'sin' && (c.setter || c.vend)) return false;
    if (['ale', 'marcos', 'laura'].includes(f.asig) && c.setter !== f.asig && c.vend !== f.asig) return false;
    if (f.tags.length && !f.tags.some(t => c.tags.includes(t))) return false;
    if (f.win) { const w = win(v); if (!w || w.s !== f.win) return false; }
    if (f.fu) {
      const d = c.fuDate; if (!d) return false;
      if (f.fu === 'hoy' && d !== T) return false;
      if (f.fu === 'semana' && !(d >= T && d <= WEEK_END)) return false;
      if (f.fu === 'vencido' && !(d < T)) return false;
      if (f.fu === 'rango' && ((f.from && d < f.from) || (f.to && d > f.to))) return false;
    }
    if (f.q) { const q = f.q.toLowerCase(); const hay = c.name.toLowerCase().includes(q) || v.msgs.some(m => (m.t || '').toLowerCase().includes(q)); if (!hay) return false; }
    return true;
  });

function threadHtml(v) {

/* ---------- Eventos ---------- */
function go(screen) { S.screen = screen; S.edit = false; closeMenu(); render(); $('#screen').scrollTop = 0; }
function closeMenu() { $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }
document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-go],[data-action],[data-conv],[data-f],[data-status],[data-contact],[data-open-conv],[data-qr],[data-fu],[data-tab],[data-demo],[data-qr-edit]');
  if (!t) return;
  const a = t.dataset.action;
  if (t.dataset.go) { if (t.dataset.go === 'importar') S.imp = 1; if (t.dataset.go === 'respuestas' && S.view === 'vacio') { S.view = 'datos'; S.editQR = -1; } go(t.dataset.go); return; }
  if (t.dataset.conv) { S.conv = t.dataset.conv; S.ivw = 'thread'; S.qrPicker = false; S.draft = ''; const v = V.find(x => x.id === S.conv); v.unread = 0; render(); scrollMsgs(); return; }
  if (t.dataset.openConv) { S.conv = t.dataset.openConv; S.ivw = 'thread'; S.f.status = 'todas'; go('bandeja'); scrollMsgs(); return; }
  if (t.dataset.contact) { S.contact = +t.dataset.contact; go('ficha'); return; }
  if (t.dataset.status) { S.f.status = t.dataset.status; render(); return; }
  if (t.dataset.tab) { S.cfgTab = t.dataset.tab; render(); return; }
  if (t.dataset.demo) { const k = t.dataset.demo; S[k] = t.dataset.v; if (k === 'role') { S.f = { status: 'abiertas', canal: [], fu: null, from: '', to: '', win: null, unres: false, asig: 'todas', tags: [], q: '' }; S.conv = null; S.lost = false; } render(); return; }
  if (t.dataset.qrEdit) { S.editQR = +t.dataset.qrEdit; render(); return; }
  if (t.dataset.f) {
    const g = t.dataset.f, v = t.dataset.v;
    if (g === 'canal' || g === 'tags') { const arr = S.f[g]; const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); }
    else if (g === 'unres') S.f.unres = !S.f.unres;
    else S.f[g] = S.f[g] === v && g !== 'asig' ? null : v;
    if (S.screen !== 'bandeja') S.screen = 'bandeja';
    render(); return;
  }
  if (t.dataset.qr) { insertQR(+t.dataset.qr); return; }
  if (t.dataset.fu) {
    const v = V.find(x => x.id === S.conv); const c = contact(v.c);
    if (t.dataset.fu === 'none') { c.fuDate = null; toast('Seguimiento quitado'); }
    else { c.fuDate = addDays(T, +t.dataset.fu); toast('Próximo seguimiento: ' + fmtD(c.fuDate)); }
    render(); return;
  }
  switch (a) {
    case 'open-menu': $('#side').classList.add('open'); $('#scrim').classList.add('on'); break;
    case 'close-menu': closeMenu(); break;
    case 'toggle-filters': S.showFilters = !S.showFilters; render(); break;
    case 'clear-filters': S.f = { status: S.f.status, canal: [], fu: null, from: '', to: '', win: null, unres: false, asig: 'todas', tags: [], q: '' }; render(); break;
    case 'back-list': S.ivw = 'list'; render(); break;
    case 'toggle-panel': S.panel = !S.panel; const p = $('#cpanel'); if (p) p.hidden = !S.panel; break;
    case 'send': sendMsg(); break;
    case 'go-wa': { const c = contact(+t.dataset.c); const wv = V.find(x => x.c === c.id && x.ch === 'wa'); if (wv) { S.conv = wv.id; toast('Abrimos la conversación de WhatsApp de ' + c.name); } render(); scrollMsgs(); break; }
    case 'close-conv': { const v = V.find(x => x.id === S.conv); v.status = v.status === 'cerrada' ? 'abierta' : 'cerrada'; toast(v.status === 'cerrada' ? 'Conversación cerrada' : 'Conversación reabierta'); render(); break; }
    case 'fu-other': S.cfu = contact(V.find(x => x.id === S.conv).c).id; render(); break;
    case 'fu-save': { const val = $('#fu-date').value; if (!val) { toast('Elegí una fecha', true); break; } const c = contact(S.cfu); c.fuDate = val; S.cfu = null; toast('Próximo seguimiento: ' + fmtD(val)); render(); break; }
    case 'add-note': toast('Nota guardada'); break;
    case 'open-contact': S.contact = +t.dataset.c; go('ficha'); break;
    case 'toggle-trash': S.trash = !S.trash; render(); break;
    case 'restore': toast('Contacto restaurado'); DELETED.length = 0; render(); break;
    case 'edit': S.edit = true; render(); break;
    case 'cancel-edit': S.edit = false; render(); break;
    case 'save-edit': S.edit = false; toast('Datos guardados'); render(); break;
    case 'dnc': modal('<div class="modal-head"><h3>Marcar «no contactar»</h3></div><div class="modal-body"><p>No se le va a poder escribir a ' + esc(contact(S.contact).name) + ' por ningún canal, y se pausan sus secuencias. Solo un Admin o el Owner puede quitar la marca.</p><div class="field"><label>Motivo</label><input class="input" value="Lo pidió por mensaje"></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Cancelar</button><button class="btn danger" data-action="dnc-ok">Marcar</button></div>'); break;
    case 'dnc-ok': contact(S.contact).dnc = { reason: 'Marcado a mano', at: 'hoy' }; closeModal(); toast('Marcado como «no contactar»'); render(); break;
    case 'undnc': delete contact(S.contact).dnc; toast('Marca quitada. Queda en el historial.'); render(); break;
    case 'delete': modal('<div class="modal-head"><h3>Eliminar contacto</h3></div><div class="modal-body"><p>' + esc(contact(S.contact).name) + ' pasa a Eliminados. Se puede restaurar durante 30 días; después se borra definitivamente.</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">Cancelar</button><button class="btn danger" data-action="delete-ok">Eliminar</button></div>'); break;
    case 'delete-ok': closeModal(); toast('Contacto eliminado. Podés restaurarlo durante 30 días.'); go('contactos'); break;
    case 'resolve-phone': mergeModal(); break;
    case 'merge-ok': { closeModal(); const c = contact(5); c.resolved = true; c.phone = '+50670349182'; toast('Contactos unidos. La unión queda en el historial.'); S.contact = 4; go('ficha'); break; }
    case 'merge-no': { closeModal(); const c = contact(5); c.resolved = true; c.phone = '+50670349182'; c.handles.wa = '+506 7034 9182'; toast('Teléfono guardado. Quedan como dos contactos separados.'); render(); break; }
    case 'imp-next': S.imp = Math.min(5, S.imp + 1); render(); break;
    case 'imp-prev': S.imp = Math.max(1, S.imp - 1); render(); break;
    case 'sync': toast('Instagram sincronizado: 1 cuenta, sin cambios'); setTimeout(() => toast('Ejemplo de protección: si Zernio devolviera cero cuentas, no se desactiva ningún canal y se avisa.'), 900); break;
    case 'reconnect': reconnectModal(); break;
    case 'qr-scanned': closeModal(); S.wa = 'conectado'; toast('WhatsApp conectado. El episodio queda en el historial.'); render(); break;
    case 'activate': toast('Canal activado: vuelve a recibir mensajes'); break;
    case 'disconnect': modal('<div class="modal-head"><h3>Desconectar @alomercadeo</h3></div><div class="modal-body"><p>Si desconectás <b>@alomercadeo</b>, los mensajes que le escriban por Instagram <b>dejan de llegar</b> a la bandeja.</p><p class="muted">Las conversaciones y los mensajes que ya están guardados no se borran. Podés volver a activarlo desde Canales.</p><div class="field"><label>Escribí alomercadeo para confirmar</label><input class="input" placeholder="alomercadeo"></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Cancelar</button><button class="btn danger" data-action="disc-ok">Desconectar</button></div>'); break;
    case 'disc-ok': closeModal(); toast('@alomercadeo quedó inactivo. El historial se conserva.'); break;
    case 'test-key': toast('No pudimos conectar con Resend: la clave no es válida. Revisá que la copiaste completa.', true); break;
    case 'qr-new': S.editQR = -1; render(); break;
    case 'qr-cancel': S.editQR = null; render(); break;
    case 'qr-save': S.editQR = null; toast('Respuesta rápida guardada'); render(); break;
    case 'qr-del': toast('Respuesta rápida eliminada. Podés restaurarla durante 30 días.'); break;
    case 'invite': modal('<div class="modal-head"><h3>Invitar al equipo</h3></div><div class="modal-body"><div class="field"><label>Correo</label><input class="input" placeholder="nombre@correo.com"></div><div class="field"><label>Rol</label><select class="input"><option>Member: ve solo sus leads</option><option>Admin: ve todo y configura</option></select></div><p class="help">La invitación llega por correo y vence a los 7 días.</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="invite-ok">Enviar invitación</button></div>'); break;
    case 'invite-ok': closeModal(); toast('Invitación enviada por correo'); break;
    case 'switch': t.classList.toggle('on'); break;
    case 'locked': toast('Esta regla no se puede desactivar'); break;
    case 'saved': toast('Cambios guardados'); break;
    case 'demo': S.demoOpen = !S.demoOpen; renderDemo(); break;
    case 'demo-ok': toast('Cambios guardados'); break;
    case 'demo-err': toast('No se pudo guardar: se perdió la conexión. Revisá internet y volvé a intentar.', true); break;
    case 'close-modal': closeModal(); break;
    case 'retry': S.view = 'datos'; render(); break;
    case 'lose-lead': S.lost = true; S.screen = 'bandeja'; S.ivw = 'thread'; render(); break;
    case 'back-list-lost': S.lost = false; S.ivw = 'list'; render(); break;
    case 'private-reply': { const v = V.find(x => x.id === S.conv); if (!(S.draft || '').trim()) { toast('Escribí la respuesta antes de enviarla', true); break; } v.msgs.push({ f: 'out', t: S.draft.trim(), at: 'ahora' }); v.replied = true; S.draft = ''; toast('Respuesta privada enviada por Instagram'); render(); break; }
    case 'public-reply': toast('Respuesta pública publicada en el comentario'); break;
    case 'unres-queue': S.f.unres = true; S.f.status = 'todas'; go('bandeja'); break;
    case 'suggest-merge': modal('<div class="modal-head"><h3>¿Es la misma persona?</h3></div><div class="modal-body"><div class="merge"><div class="side-card"><b>Carolina Ureña</b><span class="muted">Instagram · @caro.urena</span><span>1 conversación · sábado</span></div><div class="side-card"><b>Caro Ureña</b><span class="muted">Importada de una planilla · caro.urena</span><span>Sin conversaciones · Etiqueta: Sesión de Claridad</span></div></div><p class="help">Solo coincide el usuario de Instagram. Si las unís, quedan juntas las conversaciones, notas, etiquetas y el origen, y queda en el historial.</p></div><div class="modal-foot"><button class="btn" data-action="suggest-no">No es la misma</button><button class="btn primary" data-action="suggest-ok">Unir contactos</button></div>', true); break;
    case 'suggest-ok': closeModal(); delete contact(12).suggest; toast('Contactos unidos. Queda en el historial.'); render(); break;
    case 'suggest-no': closeModal(); delete contact(12).suggest; toast('Listo: no se vuelve a sugerir.'); render(); break;
    case 'note-edit': toast('Editando la nota (demo)'); break;
    case 'note-del': toast('Nota eliminada. Podés restaurarla durante 30 días.'); break;
    case 'remove-member': toast('Laura Mora fue removida. Sus leads quedan sin asignar.'); break;
    case 'close-alert': toast('Alerta cerrada. Queda en el historial.'); break;
    case 'close-modal-bg': if (e.target === t) closeModal(); break;
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.f.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'cq') { S.cq = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#cq'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'draft') {
    S.draft = e.target.value;
    const m = S.draft.match(/(^|\s)\/(\w*)$/);
    const show = !!m; const q = m ? m[2].toLowerCase() : '';
    if (show !== S.qrPicker || q !== S.qrQ) { S.qrPicker = show; S.qrQ = q; S.qrSel = 0; const pos = e.target.selectionStart; render(); const d = $('#draft'); d.focus(); d.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fu-from') { S.f.from = e.target.value; render(); }
  if (e.target.id === 'fu-to') { S.f.to = e.target.value; render(); }
  if (e.target.id === 'cfu') { S.f.fu = e.target.value || null; render(); }
  if (e.target.dataset.assign) toast('Asignación guardada. Queda en el historial.');
});
document.addEventListener('keydown', function (e) {
  if (e.target.id === 'draft') {
    if (S.qrPicker && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); S.qrSel = (S.qrSel + (e.key === 'ArrowDown' ? 1 : QR.length - 1)) % QR.length; render(); $('#draft').focus(); return; }
    if (S.qrPicker && e.key === 'Enter') { e.preventDefault(); const sh = QR.map((q, i) => [q, i]).filter(x => !S.qrQ || x[0].k.slice(1).includes(S.qrQ) || x[0].t.toLowerCase().includes(S.qrQ)); if (sh[S.qrSel]) insertQR(sh[S.qrSel][1]); return; }
    if (S.qrPicker && e.key === 'Escape') { S.qrPicker = false; render(); $('#draft').focus(); return; }
    if (e.key === 'Enter' && !e.shiftKey) { const cv = V.find(x => x.id === S.conv); if (cv && cv.kind === 'comment') return; e.preventDefault(); sendMsg(); }
  }
  if (e.key === 'Escape' && $('#overlay').innerHTML) closeModal();
});
function insertQR(i) {
  const v = V.find(x => x.id === S.conv); const c = contact(v.c);
  const first = c.name.split(' ')[0];
  S.draft = S.draft.replace(/\/\w*$/, '') + QR[i].t.replace(/\{\{contact\.display_name\}\}/g, first).replace(/\{\{workspace\.name\}\}/g, 'ALO Mercadeo');
  S.qrPicker = false; render(); const d = $('#draft'); if (d) { d.focus(); d.setSelectionRange(d.value.length, d.value.length); }
}
function sendMsg() {
  const txt = (S.draft || '').trim(); if (!txt) return;
  const v = V.find(x => x.id === S.conv);
  const w0 = win(v);
  if (w0 && w0.s === 'por-vencer') { v.h = 24.1; render(); toast('No se envió: la ventana de 24 horas se cerró mientras escribías. Escribile desde la app de Instagram.', true); return; }
  const now = new Intl.DateTimeFormat('es-CR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ }).format(new Date());
  v.msgs.push({ f: 'out', t: txt, at: now }); v.time = now; S.draft = ''; render(); scrollMsgs(); toast('Enviado por ' + chName(v.ch));
}
function scrollMsgs() { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }
function mergeModal() {
  modal('<div class="modal-head"><h3>Este teléfono ya es de otro contacto</h3></div><div class="modal-body"><p>+506 7034 9182 pertenece a <b>Andrea Villalobos</b>. ¿Son la misma persona?</p><div class="merge">' +
    '<div class="side-card"><b>Lucía 🌸</b><span class="muted">WhatsApp · llegó sin número</span><span>1 conversación · hoy</span><span>Sin etapa · sin etiquetas</span></div>' +
    '<div class="side-card"><b>Andrea Villalobos</b><span class="muted">WhatsApp · +506 7034 9182</span><span>1 conversación · sábado</span><span>Ganado · Método Poderosa · 1 nota</span></div></div>' +
    '<p class="help">Si las unís, quedan juntas las conversaciones, notas, etiquetas y el origen. Unir no se deshace solo: queda registrado en el historial.</p></div><div class="modal-foot"><button class="btn" data-action="merge-no">No, son personas distintas</button><button class="btn primary" data-action="merge-ok">Unir contactos</button></div>', true);
}
function reconnectModal() {
  if (S.wa === 'agotado') {
    modal('<div class="modal-head"><h3>No se puede generar un código</h3></div><div class="modal-body"><p>WhatsApp ya no acepta más códigos para esta vinculación. Hay que empezar de cero: en el teléfono del negocio, abrí WhatsApp Business → Dispositivos vinculados, cerrá la sesión del sistema si aparece, y volvé a intentar en unos minutos.</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">Entendido</button><button class="btn primary" data-action="qr-scanned">Empezar de cero (demo)</button></div>');
    return;
  }
  modal('<div class="modal-head"><h3>Vincular WhatsApp</h3></div><div class="modal-body" style="justify-items:center;text-align:center"><div class="qr" aria-label="Código QR de ejemplo">' + QRCELLS + '</div><p>En el teléfono del negocio, abrí <b>WhatsApp Business → Dispositivos vinculados → Vincular un dispositivo</b> y escaneá este código.</p><p class="help">El código cambia cada 40 segundos.</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="qr-scanned">Ya lo escaneé (demo)</button></div>');
}

/* ---------- Arranque ---------- */
try { const h = location.hash.slice(1); if (h && (screens[h] || h.startsWith('fase2'))) S.screen = h; } catch (e) {}
if (window.innerWidth > 1200) S.panel = true;
render();
scrollMsgs();
})();
</script>
